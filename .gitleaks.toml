# Personal-data and secret scan for pull requests.
# Extends the default gitleaks rules with generic personal-data patterns.
# Project-specific names are not listed here; they live in the
# PERSONAL_DATA_DENYLIST Actions secret (see .github/workflows/personal-data-guard.yml).
title = "personal-data-guard"

[extend]
useDefault = true

[[rules]]
id = "personal-email"
description = "Email address at a personal mail provider"
regex = '''\b[A-Za-z0-9._%+-]+@(?:gmail|googlemail|hotmail|outlook|live|msn|yahoo|icloud|me|proton|protonmail|pm|videotron|sympatico|bell|gmx|aol)\.[a-z.]{2,6}\b'''
keywords = ["@"]
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''^(?:user|test|example|unknown|someone|name|your[._-]?name|u\.ser|john\.doe|jane\.doe)@''']

[[rules]]
id = "phone-number"
description = "North American phone number"
regex = '''(?:\+?1[-. ]?)?\(?\b[2-9][0-9]{2}\)?[-. ][2-9][0-9]{2}[-. ][0-9]{4}\b'''
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''555[-. ]01[0-9]{2}$''']

[[rules]]
id = "public-ipv4"
description = "Public IPv4 address (private, loopback, CGNAT and documentation ranges are allowed)"
regex = '''\b(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\b'''
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = [
    '''^(?:0|10|127)\.''',
    '''^192\.168\.''',
    '''^172\.(?:1[6-9]|2[0-9]|3[01])\.''',
    '''^100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.''',
    '''^169\.254\.''',
    '''^(?:192\.0\.2|198\.51\.100|203\.0\.113)\.''',
    '''^2(?:2[4-9]|[3-5][0-9])\.''',
    '''^(?:1\.1\.1\.1|1\.0\.0\.1|8\.8\.8\.8|8\.8\.4\.4|9\.9\.9\.9|149\.112\.112\.112|208\.67\.222\.222|208\.67\.220\.220)$''',
  ]

[allowlist]
description = "Known placeholder fixtures and public identifiers"
regexTarget = "line"
regexes = [
  # Cloudflare Access application AUD tag: a public audience id, not a secret.
  '''access_?[Aa]ud''',
]
paths = [
  '''docs/development/features/backend/SANDBOX_(?:ENVIRONMENT_GUIDE|QUICK_REFERENCE)\.md''',
  '''services/api-backend/services/sandbox-service\.js''',
  '''test/powershell/TestConfig\.ps1''',
  '''(?:^|/)pubspec\.lock$''',
  '''(?:^|/)package-lock\.json$''',
]
