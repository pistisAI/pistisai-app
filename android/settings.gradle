pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.1.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"

// tesseract_ocr 0.5.0 still calls jcenter(), which Gradle 9 removed.
// Gradle resolves that call through its dynamic object, so register it as
// an extension on each repository handler before the project is evaluated.
def shimJcenter = { handler ->
    // Zero-arg closure: Gradle invokes extra properties via doCall(args),
    // and a closure with an implicit `it` does not match jcenter().
    handler.ext.jcenter = { ->
        handler.maven {
            name = "jcenter"
            url = "https://repo.maven.apache.org/maven2/"
        }
    }
}
gradle.beforeProject { project ->
    // A plugin script can call rootProject.allprojects { repositories { jcenter() } }
    // before those projects have started evaluating, so shim every project
    // that already exists, not only the one about to be evaluated.
    project.rootProject.allprojects { each ->
        shimJcenter(each.buildscript.repositories)
        shimJcenter(each.repositories)
    }
}
