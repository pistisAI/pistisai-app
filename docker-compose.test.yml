version: '3.8'

services:
  test-desktop:
    build:
      context: .
      dockerfile: Dockerfile.test-desktop
    environment:
      - DISPLAY=:99
    ports:
      - "5900:5900"   # x11vnc for remote debugging
      - "1337:1337"   # App router / health endpoint (for host-side test runners)
    volumes:
      - test-recordings:/recordings
      - test-logs:/tmp
    command: ["/app/start_test_desktop.sh", "--with-app", "--wait", "--record-video", "--video-file", "/recordings/test_run.mp4"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:1337/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Optional: Run integration tests in a separate container that has the
  # Dart SDK and can reach the test-desktop app via the shared Docker network.
  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.test-desktop
    depends_on:
      test-desktop:
        condition: service_healthy
    volumes:
      - .:/workspace
      - test-recordings:/recordings
    working_dir: /workspace
    command: >
      sh -c "
        dart pub get && \
        dart test test/integration/ --reporter expanded
      "
    profiles:
      - test
    # test-desktop exposes 1337 inside its network namespace; within the
    # same Docker network the service name 'test-desktop' resolves to it.
    environment:
      - PISTISAI_APP_URL=http://test-desktop:1337

volumes:
  test-recordings:
  test-logs:
