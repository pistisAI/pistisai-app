name: "WFVAR-P 🧪 — Test & Build Every Branch"

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: echo ok
