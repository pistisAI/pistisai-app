name: Tracker hygiene closes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close:
    if: github.head_ref == 'cursor/coming-soon-dead-ends-c45e'
    runs-on: ubuntu-latest
    steps:
      - name: Close completed and duplicate issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: pistisAI/pistisai-app
        run: |
          set -euo pipefail

          close_issue() {
            local number="$1"
            local comment="$2"
            gh issue close "$number" --comment "$comment" || \
              echo "WARN: could not close #$number"
          }

          close_issue 176 'Fixed on main: agent display name uses configuredAgentName() (default Agent; Avatar settings).'
          close_issue 150 'Fixed on main: createTunnelRoutes(sshProxy, logger, sshAuthService) is wired.'
          close_issue 143 'Fixed in 2c8a0ad: removed the no-op stats timer. Legacy tunnel stays disabled; MetricsCollector owns real stats.'
          close_issue 161 'Duplicate of #111. LangChain is not the agent runtime.'
          close_issue 166 'Duplicate of #118 (backend placeholder umbrella).'
          close_issue 167 'Duplicate of #118 (backend placeholder umbrella).'
          close_issue 168 'Duplicate of #118. Cert revocation landed in c60bda7.'
          close_issue 169 'Duplicate of #118 (backend placeholder umbrella).'
          close_issue 178 'Duplicate of #148. Do not implement SSH as the primary path; Tailscale is the mesh.'

          gh pr close 175 --comment 'Obsolete: main already resolved streaming-proxy package.json as the TS6 alias without a typescript override (89cf329).' || true
