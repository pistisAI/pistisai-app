name: "📱 Mobile Build & Release"

on:
  workflow_run:
    workflows: ["🌐 Web Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated)"
        required: false
        default: "android"
        type: string
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-mobile.yml"

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
      - name: flutter analyze
        run: |
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

  get_version:
    name: Read Version
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: read
        run: |
          VERSION=$(jq -r '.version' assets/version.json | cut -d+ -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

  build_android:
    name: Android Build
    needs: get_version
    if: contains(inputs.platforms || 'android', 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set Version
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: Setup Android SDK platform 37
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME=${ANDROID_HOME:-unset}" >&2
            ls -R "${ANDROID_HOME:-/nonexistent}" | head -50 >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # API 37 is published as platforms;android-37.0.
          # AGP 9.1.1 resolves it from compileSdk 37 + compileSdkMinor 0.
          if ! "$SDKMANAGER" --install "platforms;android-37.0" > /tmp/sdk.log 2>&1; then
            echo "sdkmanager install failed — output:" >&2
            tail -60 /tmp/sdk.log >&2
            exit 1
          fi

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_B64_ALT: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          STORE_PASSWORD_ALT: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          b64="${KEYSTORE_B64:-${KEYSTORE_B64_ALT:-}}"
          store="${STORE_PASSWORD:-${STORE_PASSWORD_ALT:-}}"
          if [ -z "$b64" ] || [ -z "$store" ] || [ -z "${KEY_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "Android signing secrets are missing."
            echo "Set ANDROID_KEYSTORE_B64 or ANDROID_KEYSTORE_BASE64,"
            echo "ANDROID_STORE_PASSWORD or ANDROID_KEYSTORE_PASSWORD,"
            echo "ANDROID_KEY_PASSWORD, and ANDROID_KEY_ALIAS."
            exit 1
          fi
          printf '%s' "$b64" | base64 -d > android/release-keystore.jks
          if [ ! -s android/release-keystore.jks ]; then
            echo "Decoded keystore is empty."
            exit 1
          fi
          umask 077
          {
            printf 'storePassword=%s\n' "$store"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=../release-keystore.jks\n'
          } > android/key.properties

      - name: Flutter Build APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  build_ios:
    name: iOS Build
    needs: get_version
    if: contains(inputs.platforms || 'android', 'ios')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Verify iOS platform is configured
        run: |
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "iOS platform is not configured in this repository."
            echo "Add it locally with: flutter create --platforms=ios ."
            exit 1
          fi

      - name: Set Version
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          sed -i "" "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: Flutter Build iOS
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v7
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 30

  create_release:
    needs: [get_version, build_android, build_ios]
    if: >-
      github.event_name != 'pull_request' &&
      needs.get_version.result == 'success' &&
      (needs.build_android.result == 'success' || needs.build_android.result == 'skipped') &&
      (needs.build_ios.result == 'success' || needs.build_ios.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Organize artifacts
        run: |
          mkdir -p release-assets
          if [ -d "android-apks" ]; then
            cp android-apks/*.apk release-assets/ 2>/dev/null || true
          fi
          if [ -d "ios-build" ]; then
            cd ios-build && zip -r ../release-assets/Pistisai-iOS.app.zip Runner.app && cd ..
          fi
          ls -lh release-assets/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/*"
          tag: "mobile-v${{ needs.get_version.outputs.version }}"
          name: "PistisAI Mobile v${{ needs.get_version.outputs.version }}"
          artifactErrorsFailBuild: true
          allowUpdates: true
          makeLatest: false
          body: |
            ## PistisAI Mobile v${{ needs.get_version.outputs.version }}

            ### Android
            - APK(s) attached

            ### iOS
            - Runner.app zip attached (no codesign — dev build)
          token: ${{ secrets.GITHUB_TOKEN }}