name: "📱 Mobile Build & Release"

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated)"
        required: false
        default: "android,ios"
        type: string

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
      - name: flutter analyze
        run: |
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

  get_version:
    name: Read Version
    needs: analyze
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: read
        run: |
          VERSION=$(jq -r '.version' assets/version.json | cut -d+ -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

  build_android:
    name: Android Build
    needs: get_version
    if: contains(inputs.platforms, 'android')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set Version
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/release-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../release-keystore.jks
          EOF

      - name: Flutter Build APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  build_ios:
    name: iOS Build
    needs: get_version
    if: contains(inputs.platforms, 'ios')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Set Version
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          sed -i "" "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: Flutter Build iOS
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v7
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 30

  create_release:
    needs: [get_version, build_android, build_ios]
    if: >-
      always() &&
      (needs.build_android.result == 'success' || needs.build_android.result == 'skipped') &&
      (needs.build_ios.result == 'success' || needs.build_ios.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Organize artifacts
        run: |
          mkdir -p release-assets
          if [ -d "android-apks" ]; then
            cp android-apks/*.apk release-assets/ 2>/dev/null || true
          fi
          if [ -d "ios-build" ]; then
            cd ios-build && zip -r ../release-assets/Pistisai-iOS.app.zip Runner.app && cd ..
          fi
          ls -lh release-assets/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/*"
          tag: "mobile-v${{ needs.get_version.outputs.version }}"
          name: "PistisAI Mobile v${{ needs.get_version.outputs.version }}"
          artifactErrorsFailBuild: true
          allowUpdates: true
          makeLatest: false
          body: |
            ## PistisAI Mobile v${{ needs.get_version.outputs.version }}

            ### Android
            - APK(s) attached

            ### iOS
            - Runner.app zip attached (no codesign — dev build)
          token: ${{ secrets.GITHUB_TOKEN }}