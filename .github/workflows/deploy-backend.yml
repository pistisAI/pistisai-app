name: "🖥️ Backend Deploy"

on:
  workflow_run:
    workflows: ["🌐 Web Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build of all backend containers"
        required: false
        default: false
        type: boolean

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build_images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' assets/version.json | cut -d+ -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying backend version: $VERSION"

      - name: Build and Push Backend Images
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          REPO_LOWER=${GITHUB_REPOSITORY,,}
          VERSION="${{ steps.version.outputs.version }}"
          TAG_SUFFIX="${VERSION}-${GITHUB_SHA:0:7}"

          read -r BASE TARGET < <(bash scripts/ci/select_backend_diff_range.sh)
          if [ "${FORCE_BUILD}" = "true" ]; then
            DIFF_FILES="$(printf '%s\n' services/api-backend/ services/streaming-proxy/ config/docker/Dockerfile.postgres)"
            echo "force_build: rebuilding every backend image"
          else
            DIFF_FILES=$(git diff --name-only "$BASE" "$TARGET")
          fi
          echo "Changed files:"
          printf '%s\n' "$DIFF_FILES"

          publish=false
          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${HEAD_BRANCH}" = "main" ]; then
            publish=true
          fi

          built=0
          build_and_push() {
            local name=$1 dockerfile=$2
            echo "=== Building $name ==="
            docker build -t "ghcr.io/${REPO_LOWER}/${name}:build-${TAG_SUFFIX}" -f "$dockerfile" .
            if [ "$publish" = "true" ]; then
              docker tag "ghcr.io/${REPO_LOWER}/${name}:build-${TAG_SUFFIX}" "ghcr.io/${REPO_LOWER}/${name}:latest"
              docker tag "ghcr.io/${REPO_LOWER}/${name}:build-${TAG_SUFFIX}" "ghcr.io/${REPO_LOWER}/${name}:v${VERSION}"
              docker push "ghcr.io/${REPO_LOWER}/${name}:latest"
              docker push "ghcr.io/${REPO_LOWER}/${name}:v${VERSION}"
              docker push "ghcr.io/${REPO_LOWER}/${name}:build-${TAG_SUFFIX}"
            else
              echo "Skipping push for $name (branch is not main)"
            fi
            built=1
          }

          if echo "$DIFF_FILES" | grep -qE "services/api-backend/|config/docker/Dockerfile.api-backend"; then
            build_and_push api-backend config/docker/Dockerfile.api-backend
          fi

          if echo "$DIFF_FILES" | grep -qE "services/streaming-proxy/|config/docker/Dockerfile.streaming-proxy"; then
            build_and_push streaming-proxy config/docker/Dockerfile.streaming-proxy
          fi

          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.postgres|config/docker/postgres-|config/docker/init.sql|services/postgres/"; then
            build_and_push postgres config/docker/Dockerfile.postgres
          fi

          if [ "$built" -eq 0 ]; then
            echo "No backend image paths changed"
            exit 0
          fi
          echo "Backend images built"