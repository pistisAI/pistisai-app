name: "🧪 Extended tests"

# Security and regression tests that pass but were not run by any other
# workflow. Runs on every pull request to main, with no path filter, so a
# change anywhere cannot silently break them. Separate from test.yml so the
# existing gate jobs stay unchanged.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: extended-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-extended:
    name: "🧪 Flutter — extended"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - name: "📦 flutter pub get"
        run: flutter pub get

      # Same as test.yml: install the native deps the linux_native_deps build
      # hook would otherwise install silently inside the first `dart run`.
      - name: "📦 Native build deps (for build hooks)"
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get update -qq $apt_opts
          sudo apt-get install -y -qq --no-install-recommends $apt_opts \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev liblzma-dev libstdc++-12-dev

      - name: Bake Pistisai brand
        run: bash tool/brand.sh pistisai

      - name: "🧪 flutter test (everything outside the security gate)"
        run: bash scripts/ci/flutter_extended_tests.sh

  backend-extended:
    name: "🔒 Backend — extended auth & access"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api-backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version-file: .nvmrc

      - name: "📦 npm ci"
        run: npm ci --no-audit --no-fund

      - name: "🔒 npm run test:ci:extended"
        run: npm run test:ci:extended

  other-suites:
    name: "🧪 Proxy, auth, SDK, policy, plugin & skill tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version-file: .nvmrc

      - name: "📦 npm ci (streaming-proxy)"
        working-directory: services/streaming-proxy
        run: npm ci --no-audit --no-fund

      - name: "🧪 streaming-proxy (auth middleware, config-write auth, …)"
        working-directory: services/streaming-proxy
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js

      # The repo root has no lockfile, so these root-level suites use the
      # Jest that streaming-proxy installs from its lockfile.
      - name: "🧪 Repository policy + streaming-proxy /stats auth"
        run: >-
          node --experimental-vm-modules
          services/streaming-proxy/node_modules/jest/bin/jest.js
          --config jest.extended.config.js

      # Legacy Auth0 JWT service is quarantined. This step only asserts
      # handlers.js refuses to start. Cloudflare Access coverage stays in
      # the backend-extended job (services/api-backend test:ci:extended).
      - name: "🧪 backend/auth quarantine (refuses to start)"
        working-directory: backend/auth
        run: node --test handlers.test.js

      - name: "📦 npm ci (sdk)"
        working-directory: services/sdk
        run: npm ci --no-audit --no-fund

      - name: "🧪 sdk"
        working-directory: services/sdk
        run: npm test

      - name: "🧪 Hermes plugins (python unittest)"
        run: python3 -m unittest discover -s test/hermes-plugins -p 'test_*.py' -v

      # Lockfile is committed so npm ci matches the other Node jobs. The
      # personality skill tests are Vitest, not Jest.
      - name: "📦 npm ci (openclaw skill)"
        working-directory: services/openclaw-skills/pistisai
        run: npm ci --no-audit --no-fund

      - name: "🧪 openclaw personality skill"
        working-directory: services/openclaw-skills/pistisai
        run: npm test
