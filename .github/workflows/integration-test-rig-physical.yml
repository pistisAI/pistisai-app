name: "🧪 Integration Test Rig (Local PC)"

# Self-hosted runner on your Linux PC (label integration-rig): Docker hub + emulator, not USB phone.
on:
  workflow_dispatch:
  # Optional: uncomment after a runner with label `integration-rig` is online.
  # push:
  #   branches: [main]
  #   paths:
  #     - "integration_test/**"
  #     - "scripts/run_*integration*"
  #     - "docker-compose.test.yml"
  #     - "Dockerfile.test-desktop"

concurrency:
  group: integration-test-rig-physical-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  physical_rig:
    name: "🖥️ Local hub + Android emulator"
    runs-on: [self-hosted, linux, integration-rig]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: "🔧 Flutter pub get"
        run: flutter pub get

      - name: "Enable KVM"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: "📱 Emulator AVD"
        run: bash scripts/setup-android-test-emulator.sh

      - name: "🧪 Run local PC integration rig"
        run: bash scripts/run_pc_integration_test_rig.sh --no-cleanup

      - name: "📹 Upload hub recording"
        if: always()
        run: |
          docker compose -f docker-compose.test.yml cp \
            test-desktop:/recordings/test_run.mp4 ./test_run.mp4 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: physical-integration-rig-recording
          path: test_run.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: "🧹 Cleanup hub"
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans || true
