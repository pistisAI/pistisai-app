name: "💻 Desktop Build & Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.0). Leave empty for auto-bump."
        required: false
        default: ""
        type: string
      platforms:
        description: "Platforms to build (comma-separated)"
        required: false
        default: "linux,windows,macos"
        type: string
      bump:
        description: "Version bump type"
        required: false
        default: "minor"
        type: choice
        options:
          - patch
          - minor
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "windows/**"
      - "linux/**"
      - "macos/**"
      - ".github/workflows/build-desktop.yml"
    tags:
      - "v*"

env:
  PLATFORMS: ${{ inputs.platforms || 'linux,windows,macos' }}

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
      - name: flutter analyze
        run: |
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

  set_version:
    name: Set Version
    needs: analyze
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve platforms
        id: platforms
        run: |
          PLATFORMS="${{ inputs.platforms }}"
          if [ -z "$PLATFORMS" ]; then
            PLATFORMS="${{ env.PLATFORMS }}"
          fi
          [ -z "$PLATFORMS" ] && PLATFORMS="linux,windows,macos"
          echo "Resolved platforms: $PLATFORMS"
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Full release tag (v1.1.0): extract version, use as-is
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [ -n "${{ inputs.version }}" ]; then
            # workflow_dispatch with explicit version
            VERSION=${{ inputs.version }}
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # workflow_dispatch without version: auto-bump based on input
            BUMP="${{ inputs.bump || 'minor' }}"
            CURRENT=$(jq -r '.version' assets/version.json | cut -d+ -f1)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            if [ "$BUMP" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            elif [ "$BUMP" = "patch" ]; then
              PATCH=$((PATCH + 1))
            fi
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          else
            # Push to main or tag push: read version from tree
            VERSION=$(jq -r '.version' assets/version.json)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

  build_linux:
    name: Linux Build
    needs: set_version
    if: contains(needs.set_version.outputs.platforms, 'linux')
    # GitHub-hosted: the previous self-hosted desktop-build runner lost
    # communication mid-compile (run 33776998037). ubuntu-24.04 matches CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set Version
        run: |
          VERSION=${{ needs.set_version.outputs.version }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build pkg-config zip \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev libsecret-1-dev \
            libcurl4-openssl-dev libnotify-dev libjsoncpp-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav libfuse2 dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: Flutter Build Linux
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package Linux Distributions
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p dist/linux

          STAGING_DIR=$(mktemp -d)
          mkdir -p $STAGING_DIR/pistisai
          cp -r build/linux/x64/release/bundle/* $STAGING_DIR/pistisai/
          tar -czf dist/linux/Pistisai-Linux-x64.tar.gz -C $STAGING_DIR pistisai

          chmod +x scripts/packaging/build_deb.sh
          ./scripts/packaging/build_deb.sh

          chmod +x scripts/packaging/build_appimage.sh
          ./scripts/packaging/build_appimage.sh

          ls -lh dist/linux/
          test -f "dist/linux/Pistisai-Linux-${VERSION}-x86_64.AppImage"
          test -f "dist/linux/Pistisai-Linux-${VERSION}-x86_64.AppImage.sha256"

      - name: Generate Installer Script
        run: |
          chmod +x scripts/packaging/build_installer.sh || true
          ./scripts/packaging/build_installer.sh || echo "Installer script skipped"

      - name: Upload Linux Bundles
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundles
          path: dist/linux/*
          retention-days: 7

  build_windows:
    name: Windows Build
    needs: set_version
    if: contains(needs.set_version.outputs.platforms, 'windows')
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set Version
        run: |
          VERSION=${{ needs.set_version.outputs.version }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: Flutter Build Windows
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package Portable ZIP
        run: |
          mkdir -p dist/windows
          cd build/windows/x64/runner/Release
          WS="$(echo $GITHUB_WORKSPACE | sed 's|\\|/|g')"
          7z a -tzip "$WS/dist/windows/Pistisai-Windows-x64-portable.zip" *
          echo "✅ Portable zip created"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          echo "ISCC_PATH=/c/ProgramData/chocolatey/lib/innosetup/tools/ISCC.exe" >> $GITHUB_ENV
          echo "✅ Inno Setup installed"

      - name: Build Windows Installer
        run: |
          if [ -f "windows/installer/Pistisai.iss" ]; then
            ISCC="/c/ProgramData/chocolatey/lib/innosetup/tools/ISCC.exe"
            if [ ! -f "$ISCC" ]; then
              ISCC=$(find /c/ProgramData/chocolatey -name "ISCC.exe" 2>/dev/null | head -1)
            fi
            if [ -f "$ISCC" ]; then
              "$ISCC" windows/installer/Pistisai.iss
              echo "✅ Installer built"
            else
              echo "ISCC not found" >&2
              exit 1
            fi
          else
            echo "No Pistisai.iss found" >&2
            exit 1
          fi

      - name: Require Windows download assets
        run: |
          test -f dist/windows/Pistisai-Windows-x64-portable.zip
          test -n "$(find dist/windows -maxdepth 1 -name '*.exe' -print -quit)"
          ls -lh dist/windows/

      - name: Upload Windows Bundles
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundles
          path: |
            dist/windows/*Setup*.exe
            dist/windows/*portable*.zip
          retention-days: 7

  build_macos:
    name: macOS Build
    needs: set_version
    if: contains(needs.set_version.outputs.platforms, 'macos')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Set Version
        run: |
          VERSION=${{ needs.set_version.outputs.version }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "" "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: Flutter Build macOS
        run: |
          flutter pub get
          flutter build macos --release
        env:
          MACOSX_DEPLOYMENT_TARGET: 11.0

      - name: Package macOS App
        run: |
          mkdir -p dist/macos
          cd build/macos/Build/Products/Release
          zip -r /tmp/Pistisai-macOS-x64.zip pistisai.app
          cp /tmp/Pistisai-macOS-x64.zip ${{ github.workspace }}/dist/macos/
          echo "✅ macOS bundle packaged"

      - name: Upload macOS Bundle
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundles
          path: dist/macos/*.zip
          retention-days: 7

  create_release:
    needs: [set_version, build_linux, build_windows, build_macos]
    # Issue #155: never publish a partial desktop release.
    # Auto-publish on version tags (v*.*.*) or manual dispatch.
    # Push-to-main builds do NOT auto-publish releases.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) &&
      needs.build_linux.result == 'success' &&
      needs.build_windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Compute version
        run: |
          echo "VERSION=${{ needs.set_version.outputs.version }}" >> $GITHUB_ENV

      - name: Organize artifacts for release
        run: |
          mkdir -p release-assets
          if [ -d "linux-bundles" ]; then
            cp linux-bundles/* release-assets/ 2>/dev/null || true
          fi
          if [ -d "macos-bundles" ]; then
            cp macos-bundles/* release-assets/ 2>/dev/null || true
          fi
          if [ -d "windows-bundles" ]; then
            find windows-bundles -type f \( -name "*Setup*.exe" -o -name "*portable*.zip" \) \
              -exec cp {} release-assets/ \; 2>/dev/null || true
          fi
          ls -lh release-assets/

      - name: Require Linux and Windows desktop assets
        run: |
          missing=0
          require() {
            local pattern="$1"
            local label="$2"
            if ! compgen -G "release-assets/$pattern" > /dev/null; then
              echo "❌ missing required asset: $label ($pattern)"
              missing=1
            else
              echo "✅ $label"
            fi
          }
          require "Pistisai-Linux-${VERSION}-x86_64.AppImage" "Linux x86_64 AppImage"
          require "Pistisai-Linux-${VERSION}-x86_64.AppImage.sha256" "Linux AppImage SHA-256"
          require "Pistisai_${VERSION}_amd64.deb" "Debian/Ubuntu package"
          require "Pistisai-Linux-x64.tar.gz" "Linux portable tarball"
          require "install.sh" "Linux install.sh"
          require "Pistisai-Windows-x64-portable.zip" "Windows x64 portable ZIP"
          require "Pistisai-Windows-x64-Setup.exe" "Windows x64 Setup installer"
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to publish a partial desktop release (issue #155)"
            exit 1
          fi

      - name: Generate release notes
        run: |
          {
            echo "## PistisAI Desktop v${VERSION}"
            echo ""
            echo "### Linux"
            echo "- **AppImage**: \`Pistisai-Linux-${VERSION}-x86_64.AppImage\`"
            echo "- **Debian/Ubuntu**: \`Pistisai_${VERSION}_amd64.deb\`"
            echo "- **Portable**: \`Pistisai-Linux-x64.tar.gz\`"
            echo "- **Installer script**: \`install.sh\`"
            echo ""
            echo "### Windows"
            echo "- **Installer**: \`Pistisai-Windows-x64-Setup.exe\`"
            echo "- **Portable ZIP**: \`Pistisai-Windows-x64-portable.zip\`"
            if compgen -G "release-assets/Pistisai-macOS*.zip" > /dev/null; then
              echo ""
              echo "### macOS"
              echo "- **ZIP**: \`Pistisai-macOS-x64.zip\`"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: release-assets/*
          tag: "v${{ env.VERSION }}"
          name: "PistisAI v${{ env.VERSION }}"
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          bodyFile: release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub release assets published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: v${{ env.VERSION }}
          VERSION: ${{ env.VERSION }}
          RETRY_ATTEMPTS: 12
          RETRY_DELAY_SECONDS: 10
        run: python3 scripts/release/verify_github_release_assets.py
