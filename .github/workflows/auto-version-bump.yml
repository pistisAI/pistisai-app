name: "🔢 Auto Version Bump"

# RELEASE-TIME version bump: runs on every push to main (and on release or
# workflow_dispatch). It opens a version-bump PR, waits for CI to finish, then merges it.
# It never pushes to main directly; the ruleset still requires PR + checks.
# The watcher merges only after every check on the PR head has completed and
# none failed, and GitHub reports CLEAN. CLEAN alone is not enough: main has no
# required status checks, so a PR is CLEAN before CI reports (PR #1002 merged
# 7 s after it opened, while its checks ran for 9 more minutes). It does not
# rely on repo auto-merge: GitHub rejects --auto while mergeStateStatus is
# UNKNOWN or CLEAN, which stranded PR #918 when the watcher step never started.
#
# Every merged PR bumps. The bump SIZE comes from the merged PR's Conventional
# Commit title (see scripts/version_bump_kind.py):
#   type!: / BREAKING CHANGE  -> major
#   feat                      -> patch (minor is a manual workflow_dispatch release)
#   anything else             -> patch
# A manual workflow_dispatch `bump` input overrides the title-derived size.
# Release PRs (chore(release): bump version ...) are skipped to avoid a loop.
# Web deploys first (fastest), then desktop/mobile/backend in parallel.

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: "Bump version"
    runs-on: ubuntu-24.04
    # The watcher below waits up to 25 min for CI, so the job outlives that
    # window. A 5-minute job timeout killed run 45038423564 mid-wait and left
    # PR #923 open (log: "Terminate orphan process: sleep").
    timeout-minutes: 30
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Push: pin the commit that was pushed so a later merge cannot
          # change the bump kind. Release and workflow_dispatch stay on main.
          # github.ref on a release event is the tag; a bump branch cut from
          # that tag can conflict with or overwrite the version on main.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 1

      - name: Determine bump type
        id: bump_type
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Manual dispatch: honour the explicit input.
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "${INPUT_BUMP:-}" ]; then
            TYPE="$INPUT_BUMP"
          else
            # push to main: the merge commit subject is the merged PR title.
            TITLE="$(git log -1 --format=%s HEAD)"
            BODY="$(git log -1 --format=%b HEAD)"
            TYPE="$(python3 scripts/version_bump_kind.py "$TITLE" "$BODY")"
            if [ "$TYPE" = "skip" ]; then
              echo "Release PR merge, skipping bump: $TITLE"
              echo "type=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          case "$TYPE" in major|minor|patch) ;; *) TYPE=patch ;; esac
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Bump: $TYPE"

      - name: Compute new version
        if: steps.bump_type.outputs.type != 'skip'
        id: compute
        env:
          BUMP: ${{ steps.bump_type.outputs.type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(jq -r '.version' assets/version.json | cut -d+ -f1)
          BUILD=$(jq -r '.build_number' assets/version.json)
          # Base the bump on main only. Reading open bump PRs made each new bump
          # wait on the previous unmerged one; main is the single source of truth.
          echo "Base version: $CURRENT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_BUILD=$((BUILD + 1))
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT+$BUILD -> New: $NEW_VERSION+$NEW_BUILD ($BUMP)"

      - name: Update version.json
        if: steps.bump_type.outputs.type != 'skip'
        run: |
          set -euo pipefail
          VERSION="${{ steps.compute.outputs.version }}"
          BUILD_NUMBER="${{ steps.compute.outputs.build }}"
          jq -n \
            --arg version "$VERSION" \
            --arg build_number "$BUILD_NUMBER" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg git_commit "${GITHUB_SHA:0:7}" \
            --arg buildTimestamp "$(date +'%Y-%m-%d %H:%M:%S')" \
            '{version: $version, build_number: $build_number, build_date: $build_date, git_commit: $git_commit, buildTimestamp: $buildTimestamp}' \
            > assets/version.json
          cat assets/version.json

      - name: Update pubspec.yaml version
        if: steps.bump_type.outputs.type != 'skip'
        run: |
          set -euo pipefail
          VERSION="${{ steps.compute.outputs.version }}"
          BUILD_NUMBER="${{ steps.compute.outputs.build }}"
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Mint bump App token
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          client-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_KEY }}

      - name: Commit bump to a branch and open an automerge PR
        if: steps.bump_type.outputs.type != 'skip'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ steps.compute.outputs.version }}
          BUILD: ${{ steps.compute.outputs.build }}
        run: |
          set -euo pipefail
          # Two pushes a few seconds apart compute the same version from main.
          # Never open a second PR for a bump that already has an open PR.
          EXISTING=$(gh pr list --state open --limit 100 --json number,title \
            | jq -r --arg t "chore(release): bump version to ${VERSION}+${BUILD}" \
              '.[] | select(.title == $t) | .number' | head -n 1)
          if [ -n "$EXISTING" ]; then
            echo "Open bump PR #$EXISTING already exists for ${VERSION}+${BUILD}; skipping duplicate."
            exit 0
          fi
          BRANCH="chore/version-bump-${VERSION}-${GITHUB_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add assets/version.json pubspec.yaml
          git commit -m "chore(release): bump version to ${VERSION}+${BUILD}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(release): bump version to ${VERSION}+${BUILD}" \
            --body "Automated version bump for ${VERSION}+${BUILD}. Auto-merges once required checks pass.")
          # Register the PR with the watcher; the watcher alone merges. No
          # merge here: right after creation no check has finished, and
          # merging on CLEAN alone merged with pending CI (#1002).
          echo "BUMP_PR_URL=$PR_URL" >> "$GITHUB_ENV"

      - name: Watch bump PR; close and report if it fails
        if: steps.bump_type.outputs.type != 'skip' && env.BUMP_PR_URL != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -uo pipefail
          # Checks gate for the PR head commit. Prints one word:
          #   passed  - something reported, all completed, none failed
          #   pending - something is queued or running
          #   failed  - a check run, workflow run or commit status failed
          #   none    - nothing has reported yet
          #   error   - the API could not be read (never merges)
          # Workflow runs are read as well as check runs: a job that waits on
          # another has no check run yet, but its workflow run is in progress.
          checks_gate() {
            local sha="$1" cr wr st all
            cr=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
              --jq '.check_runs[] | "\(.status) \(.conclusion // "none")"') || { echo error; return; }
            wr=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion // "none")"') || { echo error; return; }
            st=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
              --jq 'if .total_count == 0 then "none" else .state end') || { echo error; return; }
            all=$(printf '%s\n%s\n' "$cr" "$wr" | sed '/^$/d')
            if echo "$all" | grep -qE ' (failure|cancelled|timed_out|action_required|startup_failure|stale)$' \
              || [ "$st" = "failure" ] || [ "$st" = "error" ]; then
              echo failed; return
            fi
            if [ -z "$all" ] && [ "$st" = "none" ]; then echo none; return; fi
            if echo "$all" | grep -qvE '^completed ' || [ "$st" = "pending" ]; then
              echo pending; return
            fi
            echo passed
          }
          # Bump PRs change pubspec.yaml, so CI (test.yml, dart-analyze.yml,
          # pr-title-check.yml) always runs on them. If nothing has reported
          # after this grace period, CI did not start: leave the PR open for a
          # person rather than merge unchecked.
          NO_CHECKS_GRACE_POLLS=10   # 10 x 30 s = 5 min
          PASSED_STREAK=0
          MERGE_FAILS=0
          GATE=none
          # Wait up to ~25 min for the bump PR to merge. Bumps are queued by the
          # concurrency group, so each one has its own check window.
          for i in $(seq 1 50); do
            STATE=$(gh pr view "$BUMP_PR_URL" --json state -q .state)
            [ "$STATE" = "MERGED" ] && { echo "Bump merged: $BUMP_PR_URL"; exit 0; }
            [ "$STATE" = "CLOSED" ] && { echo "::error::Bump PR closed without merge: $BUMP_PR_URL"; exit 1; }
            HEAD_SHA=$(gh pr view "$BUMP_PR_URL" --json headRefOid -q .headRefOid)
            GATE=$(checks_gate "$HEAD_SHA")
            echo "Poll $i: head=$HEAD_SHA checks=$GATE"
            FAILED=$(gh pr view "$BUMP_PR_URL" --json statusCheckRollup -q '[.statusCheckRollup[]?|select(.conclusion=="FAILURE")]|length')
            [ "$GATE" = "failed" ] && FAILED=$(( ${FAILED:-0} + 1 ))
            MERGE=$(gh pr view "$BUMP_PR_URL" --json mergeStateStatus -q .mergeStateStatus)
            # A bump goes stale when main moves: conflicts (DIRTY) never merge, so close them too.
            if [ "${FAILED:-0}" -gt 0 ] || [ "$MERGE" = "DIRTY" ]; then
              REASON="checks failed"; [ "$MERGE" = "DIRTY" ] && REASON="conflicts with main (stale)"
              echo "::error::Bump $REASON; closing $BUMP_PR_URL so the next run recomputes cleanly"
              gh pr close "$BUMP_PR_URL" --delete-branch --comment "Auto-closed: $REASON. The next merge will recompute the version from main."
              exit 1
            fi
            if [ "$GATE" = "none" ] && [ "$i" -ge "$NO_CHECKS_GRACE_POLLS" ]; then
              echo "::error::No checks reported on $BUMP_PR_URL after 5 min; leaving it open, not merging"
              exit 1
            fi
            # Require two passing polls in a row, so a workflow that starts a
            # few seconds late is not missed.
            if [ "$GATE" = "passed" ]; then PASSED_STREAK=$((PASSED_STREAK + 1)); else PASSED_STREAK=0; fi
            # This is the release gate: merge only when every check on the head
            # commit has finished without failure and GitHub reports the PR
            # clean, without depending on the repo's auto-merge setting.
            # --match-head-commit refuses the merge if the head moved since.
            if [ "$PASSED_STREAK" -ge 2 ] && [ "$MERGE" = "CLEAN" ]; then
              echo "Checks passed and PR is clean; merging $BUMP_PR_URL at $HEAD_SHA"
              if gh pr merge "$BUMP_PR_URL" --squash --match-head-commit "$HEAD_SHA"; then
                echo "Merge command accepted"
              else
                MERGE_FAILS=$((MERGE_FAILS + 1))
                echo "::warning::gh pr merge failed (${MERGE_FAILS}/3) for $BUMP_PR_URL at $HEAD_SHA"
                if [ "$MERGE_FAILS" -ge 3 ]; then
                  echo "::error::gh pr merge failed 3 times; leaving $BUMP_PR_URL open"
                  exit 1
                fi
              fi
              STATE_NOW=$(gh pr view "$BUMP_PR_URL" --json state -q .state)
              [ "$STATE_NOW" = "MERGED" ] && { echo "Bump merged: $BUMP_PR_URL"; exit 0; }
            fi
            sleep 30
          done
          # Timeout: the PR stays open and is not merged.
          echo "::warning::Bump PR still open after 25 min (checks=$GATE): $BUMP_PR_URL"
          exit 1
