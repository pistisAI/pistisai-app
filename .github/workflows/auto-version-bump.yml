name: "🔢 Auto Version Bump"

# SINGLE ENTRY POINT for all releases.
# On every push to main, if version.json was NOT explicitly changed,
# auto-bump the patch version, commit it back, then trigger ALL platform
# build/deploy workflows via workflow_dispatch.
#
# Bump type override via commit message:
#   [major] → major bump
#   [minor] → minor bump
#   (nothing) → patch bump

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/version.json"

permissions:
  contents: write

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: "Bump version & trigger all platforms"
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Determine bump type
        id: bump_type
        run: |
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -qi '\[major\]'; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -qi '\[minor\]'; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi
          echo "Commit: $MSG"
          echo "Bump: $(grep type $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Compute new version
        id: compute
        run: |
          CURRENT=$(jq -r '.version' assets/version.json | cut -d+ -f1)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          BUMP="${{ steps.bump_type.outputs.type }}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Current: $CURRENT → New: $NEW_VERSION"

      - name: Update version.json
        run: |
          VERSION="${{ steps.compute.outputs.version }}"
          BUILD_NUMBER="${{ github.run_number }}"
          jq -n \
            --arg version "$VERSION" \
            --arg build_number "$BUILD_NUMBER" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg git_commit "${GITHUB_SHA:0:7}" \
            --arg buildTimestamp "$(date +'%Y-%m-%d %H:%M:%S')" \
            '{version: $version, build_number: $build_number, build_date: $build_date, git_commit: $git_commit, buildTimestamp: $buildTimestamp}' \
            > assets/version.json
          cat assets/version.json

      - name: Update pubspec.yaml version
        run: |
          VERSION="${{ steps.compute.outputs.version }}"
          BUILD_NUMBER="${{ github.run_number }}"
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/version.json pubspec.yaml
          git commit -m "ci: bump version to ${{ steps.compute.outputs.version }}+${{ github.run_number }} [skip ci]"
          git push origin main

      - name: Trigger ALL platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.compute.outputs.version }}"
          echo "🚀 Triggering all platform builds for v${VERSION}"

          # Desktop (Linux + Windows + macOS)
          gh workflow run build-desktop.yml --ref main \
            -f platforms=linux,windows,macos \
            && echo "✅ desktop triggered" \
            || echo "⚠️ desktop trigger failed"

          # Web deploy
          gh workflow run deploy-web.yml --ref main \
            && echo "✅ web triggered" \
            || echo "⚠️ web trigger failed"

          # Mobile (Android + iOS)
          gh workflow run build-mobile.yml --ref main \
            -f platforms=android,ios \
            && echo "✅ mobile triggered" \
            || echo "⚠️ mobile trigger failed"

          # Backend deploy
          gh workflow run deploy-backend.yml --ref main \
            && echo "✅ backend triggered" \
            || echo "⚠️ backend trigger failed"

          # Hermes VPS deploy
          gh workflow run deploy-hermes.yml --ref main \
            && echo "✅ hermes triggered" \
            || echo "⚠️ hermes trigger failed"

          echo "All platform workflows triggered for v${VERSION}"
