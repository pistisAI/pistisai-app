name: "🔢 Auto Version Bump"

# RELEASE-TIME version bump. Semi-manual by design:
# runs when a release is published (or manually via workflow_dispatch),
# and opens a version-bump PR against main. It never pushes to main directly.
# Merging that PR is the explicit release gate (ruleset requires PR + checks).
#
# Every merged PR bumps. The bump SIZE comes from the merged PR's Conventional
# Commit title (see scripts/version_bump_kind.py):
#   type!: / BREAKING CHANGE  -> major
#   feat                      -> minor
#   anything else             -> patch
# A manual workflow_dispatch `bump` input overrides the title-derived size.
# Release PRs (chore(release): bump version ...) are skipped to avoid a loop.
# Web deploys first (fastest), then desktop/mobile/backend in parallel.

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: "Bump version"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main
          fetch-depth: 1

      - name: Determine bump type
        id: bump_type
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Manual dispatch: honour the explicit input.
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "${INPUT_BUMP:-}" ]; then
            TYPE="$INPUT_BUMP"
          else
            # push to main: the merge commit subject is the merged PR title.
            TITLE="$(git log -1 --format=%s HEAD)"
            BODY="$(git log -1 --format=%b HEAD)"
            TYPE="$(python3 scripts/version_bump_kind.py "$TITLE" "$BODY")"
            if [ "$TYPE" = "skip" ]; then
              echo "Release PR merge, skipping bump: $TITLE"
              echo "type=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          case "$TYPE" in major|minor|patch) ;; *) TYPE=patch ;; esac
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Bump: $TYPE"

      - name: Compute new version
        if: steps.bump_type.outputs.type != 'skip'
        id: compute
        env:
          BUMP: ${{ steps.bump_type.outputs.type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(jq -r '.version' assets/version.json | cut -d+ -f1)
          BUILD=$(jq -r '.build_number' assets/version.json)
          # Build on the highest version among main and any open bump PR, so
          # back-to-back merges produce 1.1.108, 1.1.109... instead of duplicates.
          OPEN_BUMPS=$(gh pr list --state open --limit 100 --json title -q '.[].title' 2>/dev/null | grep 'bump version' || true)
          for V in $(echo "$OPEN_BUMPS" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true); do
            if [ "$(printf '%s\n%s\n' "$CURRENT" "$V" | sort -V | tail -1)" = "$V" ]; then CURRENT="$V"; fi
          done
          echo "Base version: $CURRENT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_BUILD=$((BUILD + 1))
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT+$BUILD -> New: $NEW_VERSION+$NEW_BUILD ($BUMP)"

      - name: Update version.json
        if: steps.bump_type.outputs.type != 'skip'
        run: |
          set -euo pipefail
          VERSION="${{ steps.compute.outputs.version }}"
          BUILD_NUMBER="${{ steps.compute.outputs.build }}"
          jq -n \
            --arg version "$VERSION" \
            --arg build_number "$BUILD_NUMBER" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg git_commit "${GITHUB_SHA:0:7}" \
            --arg buildTimestamp "$(date +'%Y-%m-%d %H:%M:%S')" \
            '{version: $version, build_number: $build_number, build_date: $build_date, git_commit: $git_commit, buildTimestamp: $buildTimestamp}' \
            > assets/version.json
          cat assets/version.json

      - name: Update pubspec.yaml version
        if: steps.bump_type.outputs.type != 'skip'
        run: |
          set -euo pipefail
          VERSION="${{ steps.compute.outputs.version }}"
          BUILD_NUMBER="${{ steps.compute.outputs.build }}"
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Mint bump App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_KEY }}

      - name: Commit and push version bump to main
        if: steps.bump_type.outputs.type != 'skip'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/version.json pubspec.yaml
          git commit -m "chore(release): bump version to ${VERSION}+${{ steps.compute.outputs.build }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
