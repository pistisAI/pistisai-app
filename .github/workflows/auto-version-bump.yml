name: "🔢 Auto Version Bump"

# RELEASE-TIME version bump. Semi-manual by design:
# runs when a release is published (or manually via workflow_dispatch),
# and opens a version-bump PR against main. It never pushes to main directly.
# Merging that PR is the explicit release gate (ruleset requires PR + checks).
#
# Bump type is set by the release tag/input, not commit messages:
#   input bump=major|minor|patch (default patch)
# Web deploys first (fastest), then desktop/mobile/backend in parallel.
#
# Bump type override via commit message:
#   [major] → major bump
#   [minor] → minor bump
#   (nothing) → patch bump

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: "Bump version"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Determine bump type
        id: bump_type
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          TYPE="${INPUT_BUMP:-patch}"
          case "$TYPE" in major|minor|patch) ;; *) TYPE=patch ;; esac
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Bump: $TYPE"

      - name: Compute new version
        id: compute
        env:
          BUMP: ${{ steps.bump_type.outputs.type }}
        run: |
          set -euo pipefail
          CURRENT=$(jq -r '.version' assets/version.json | cut -d+ -f1)
          BUILD=$(jq -r '.build_number' assets/version.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_BUILD=$((BUILD + 1))
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT+$BUILD -> New: $NEW_VERSION+$NEW_BUILD ($BUMP)"

      - name: Update version.json
        run: |
          set -euo pipefail
          VERSION="${{ steps.compute.outputs.version }}"
          BUILD_NUMBER="${{ steps.compute.outputs.build }}"
          jq -n \
            --arg version "$VERSION" \
            --arg build_number "$BUILD_NUMBER" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg git_commit "${GITHUB_SHA:0:7}" \
            --arg buildTimestamp "$(date +'%Y-%m-%d %H:%M:%S')" \
            '{version: $version, build_number: $build_number, build_date: $build_date, git_commit: $git_commit, buildTimestamp: $buildTimestamp}' \
            > assets/version.json
          cat assets/version.json

      - name: Update pubspec.yaml version
        run: |
          set -euo pipefail
          VERSION="${{ steps.compute.outputs.version }}"
          BUILD_NUMBER="${{ steps.compute.outputs.build }}"
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Commit to bump branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="chore/version-bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add assets/version.json pubspec.yaml
          git commit -m "chore(release): bump version to ${VERSION}+${{ steps.compute.outputs.build }}"
          git push -f origin "$BRANCH"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BRANCH"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(release): bump version to ${VERSION}" \
              --body "Automated release version bump to ${VERSION}+${{ steps.compute.outputs.build }}. Merge to release; required checks must pass."
          fi
