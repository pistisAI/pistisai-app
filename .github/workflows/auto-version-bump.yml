name: "🔢 Auto Version Bump"

# RELEASE-TIME version bump: runs on every push to main (and on release or
# workflow_dispatch). It opens a version-bump PR, waits for CI, then merges it.
# It never pushes to main directly; the ruleset still requires PR + checks.
# The watcher merges when GitHub reports CLEAN. It does not rely on repo
# auto-merge: GitHub rejects --auto while mergeStateStatus is UNKNOWN or CLEAN,
# which stranded PR #918 when the watcher step never started.
#
# Every merged PR bumps. The bump SIZE comes from the merged PR's Conventional
# Commit title (see scripts/version_bump_kind.py):
#   type!: / BREAKING CHANGE  -> major
#   feat                      -> patch (minor is a manual workflow_dispatch release)
#   anything else             -> patch
# A manual workflow_dispatch `bump` input overrides the title-derived size.
# Release PRs (chore(release): bump version ...) are skipped to avoid a loop.
# Web deploys first (fastest), then desktop/mobile/backend in parallel.

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: "Bump version"
    runs-on: ubuntu-24.04
    # The watcher below waits up to 25 min for CI, so the job outlives that
    # window. A 5-minute job timeout killed run 45038423564 mid-wait and left
    # PR #923 open (log: "Terminate orphan process: sleep").
    timeout-minutes: 30
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main
          fetch-depth: 1

      - name: Determine bump type
        id: bump_type
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Manual dispatch: honour the explicit input.
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "${INPUT_BUMP:-}" ]; then
            TYPE="$INPUT_BUMP"
          else
            # push to main: the merge commit subject is the merged PR title.
            TITLE="$(git log -1 --format=%s HEAD)"
            BODY="$(git log -1 --format=%b HEAD)"
            TYPE="$(python3 scripts/version_bump_kind.py "$TITLE" "$BODY")"
            if [ "$TYPE" = "skip" ]; then
              echo "Release PR merge, skipping bump: $TITLE"
              echo "type=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          case "$TYPE" in major|minor|patch) ;; *) TYPE=patch ;; esac
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Bump: $TYPE"

      - name: Compute new version
        if: steps.bump_type.outputs.type != 'skip'
        id: compute
        env:
          BUMP: ${{ steps.bump_type.outputs.type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(jq -r '.version' assets/version.json | cut -d+ -f1)
          BUILD=$(jq -r '.build_number' assets/version.json)
          # Base the bump on main only. Reading open bump PRs made each new bump
          # wait on the previous unmerged one; main is the single source of truth.
          echo "Base version: $CURRENT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_BUILD=$((BUILD + 1))
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT+$BUILD -> New: $NEW_VERSION+$NEW_BUILD ($BUMP)"

      - name: Update version.json
        if: steps.bump_type.outputs.type != 'skip'
        run: |
          set -euo pipefail
          VERSION="${{ steps.compute.outputs.version }}"
          BUILD_NUMBER="${{ steps.compute.outputs.build }}"
          jq -n \
            --arg version "$VERSION" \
            --arg build_number "$BUILD_NUMBER" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg git_commit "${GITHUB_SHA:0:7}" \
            --arg buildTimestamp "$(date +'%Y-%m-%d %H:%M:%S')" \
            '{version: $version, build_number: $build_number, build_date: $build_date, git_commit: $git_commit, buildTimestamp: $buildTimestamp}' \
            > assets/version.json
          cat assets/version.json

      - name: Update pubspec.yaml version
        if: steps.bump_type.outputs.type != 'skip'
        run: |
          set -euo pipefail
          VERSION="${{ steps.compute.outputs.version }}"
          BUILD_NUMBER="${{ steps.compute.outputs.build }}"
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Mint bump App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_KEY }}

      - name: Commit bump to a branch and open an automerge PR
        if: steps.bump_type.outputs.type != 'skip'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ steps.compute.outputs.version }}
          BUILD: ${{ steps.compute.outputs.build }}
        run: |
          set -euo pipefail
          # Two pushes a few seconds apart compute the same version from main.
          # Never open a second PR for a bump that already has an open PR.
          EXISTING=$(gh pr list --state open --limit 100 --json number,title \
            | jq -r --arg t "chore(release): bump version to ${VERSION}+${BUILD}" \
              '.[] | select(.title == $t) | .number' | head -n 1)
          if [ -n "$EXISTING" ]; then
            echo "Open bump PR #$EXISTING already exists for ${VERSION}+${BUILD}; skipping duplicate."
            exit 0
          fi
          BRANCH="chore/version-bump-${VERSION}-${GITHUB_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add assets/version.json pubspec.yaml
          git commit -m "chore(release): bump version to ${VERSION}+${BUILD}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(release): bump version to ${VERSION}+${BUILD}" \
            --body "Automated version bump for ${VERSION}+${BUILD}. Auto-merges once required checks pass.")
          # Register the PR with the watcher before any merge attempt. A failed
          # merge must never leave the PR orphaned (that is what stranded #918).
          echo "BUMP_PR_URL=$PR_URL" >> "$GITHUB_ENV"
          # mergeStateStatus is UNKNOWN for a few seconds after creation.
          # GitHub rejects --auto while UNKNOWN *and* while already CLEAN, so
          # poll until known and merge directly when clean. The watcher merges
          # later when checks finish; no dependence on repo auto-merge settings.
          STATE=UNKNOWN
          for i in $(seq 1 30); do
            STATE=$(gh pr view "$PR_URL" --json mergeStateStatus -q .mergeStateStatus)
            if [ "$STATE" != "UNKNOWN" ]; then break; fi
            sleep 2
          done
          if [ "$STATE" = "CLEAN" ]; then
            gh pr merge "$PR_URL" --squash || true
          fi

      - name: Watch bump PR; close and report if it fails
        if: steps.bump_type.outputs.type != 'skip' && env.BUMP_PR_URL != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -uo pipefail
          # Wait up to ~25 min for the bump PR to merge. Bumps are queued by the
          # concurrency group, so each one has its own check window.
          for i in $(seq 1 50); do
            STATE=$(gh pr view "$BUMP_PR_URL" --json state -q .state)
            [ "$STATE" = "MERGED" ] && { echo "Bump merged: $BUMP_PR_URL"; exit 0; }
            [ "$STATE" = "CLOSED" ] && { echo "::error::Bump PR closed without merge: $BUMP_PR_URL"; exit 1; }
            FAILED=$(gh pr view "$BUMP_PR_URL" --json statusCheckRollup -q '[.statusCheckRollup[]?|select(.conclusion=="FAILURE")]|length')
            MERGE=$(gh pr view "$BUMP_PR_URL" --json mergeStateStatus -q .mergeStateStatus)
            # A bump goes stale when main moves: conflicts (DIRTY) never merge, so close them too.
            if [ "${FAILED:-0}" -gt 0 ] || [ "$MERGE" = "DIRTY" ]; then
              REASON="checks failed"; [ "$MERGE" = "DIRTY" ] && REASON="conflicts with main (stale)"
              echo "::error::Bump $REASON; closing $BUMP_PR_URL so the next run recomputes cleanly"
              gh pr close "$BUMP_PR_URL" --delete-branch --comment "Auto-closed: $REASON. The next merge will recompute the version from main."
              exit 1
            fi
            # This is the release gate: merge as soon as GitHub reports the PR
            # clean, without depending on the repo's auto-merge setting.
            if [ "$MERGE" = "CLEAN" ]; then
              echo "Bump PR is clean; merging $BUMP_PR_URL"
              gh pr merge "$BUMP_PR_URL" --squash || true
              STATE_NOW=$(gh pr view "$BUMP_PR_URL" --json state -q .state)
              [ "$STATE_NOW" = "MERGED" ] && { echo "Bump merged: $BUMP_PR_URL"; exit 0; }
            fi
            sleep 30
          done
          echo "::warning::Bump PR still open after 25 min: $BUMP_PR_URL"
          exit 1
