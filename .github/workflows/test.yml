name: "🧪 CI — Test & Build Every Branch"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
  # Run the same test gate on pull requests so tests block merges (#682).
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: "🔎 Detect changes"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      flutter: ${{ steps.gate.outputs.flutter }}
      backend: ${{ steps.gate.outputs.backend }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Push to main diffs github.event.before..HEAD. A depth-1 clone
          # does not contain that parent, and GitHub will not fetch it by SHA.
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        continue-on-error: true
        with:
          # Empty token uses git diff (contents: read). Push compares
          # github.event.before..HEAD. Pull requests compare the PR base SHA.
          token: ""
          filters: |
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'web/**'
              - 'linux/**'
              - 'windows/**'
              - 'macos/**'
              - 'ios/**'
              - 'android/**'
              - 'assets/**'
              - 'analysis_options.yaml'
              - 'tool/**'
              - 'scripts/ci/**'
              - '.github/workflows/**'
            backend:
              - 'services/**'
              - 'backend/**'
              - 'test/api-backend/**'
              - 'scripts/ci/**'
              - 'scripts/tests/**'
              - 'jest.config.js'
              - 'jest.extended.config.js'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'Dockerfile*'
              - 'config/docker/**'
              - '.github/workflows/**'

      - name: "Run suites the diff actually needs"
        id: gate
        if: always() && (steps.filter.outcome == 'success' || steps.filter.outcome == 'failure')
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FLUTTER: ${{ steps.filter.outputs.flutter }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A broken filter must not skip the suites. Run both.
          if [ "$FILTER_OUTCOME" != "success" ]; then
            echo "Path filter failed; running Flutter and backend suites."
            echo "flutter=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FLUTTER" = "true" ] || [ "$BACKEND" = "true" ]; then
            echo "flutter=${FLUTTER}" >> "$GITHUB_OUTPUT"
            echo "backend=${BACKEND}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # paths-ignore already drops docs-only events. Reaching here means
          # this workflow ran for files the filters do not name. Running
          # nothing would let ci_gate pass on a green skip.
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            RANGE="${BASE_SHA}...HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE}...HEAD"
          else
            RANGE="HEAD^...HEAD"
          fi
          echo "No path filter matched. Changed files in ${RANGE}:"
          git diff --name-only "$RANGE"
          echo "Uncovered paths; running Flutter and backend suites."
          echo "flutter=true" >> "$GITHUB_OUTPUT"
          echo "backend=true" >> "$GITHUB_OUTPUT"

  flutter_analyze:
    name: "🔍 Flutter Analyze"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, actionlint]
    if: needs.changes.outputs.flutter == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🔍 flutter analyze"
        run: flutter analyze lib/

  flutter_smoke_test:
    name: "🧪 Flutter — smoke"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, actionlint]
    if: needs.changes.outputs.flutter == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - name: "📦 flutter pub get"
        run: flutter pub get

      # Same as in the web jobs: the linux_native_deps build hook installs these
      # itself, silently, inside the first `dart run`. On a slow mirror that
      # used the whole 10 minutes and the job was cancelled in "Bake". Install
      # them here with apt retries so the hook finds them and skips its own.
      - name: "📦 Native build deps (for build hooks)"
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get update -qq $apt_opts
          sudo apt-get install -y -qq --no-install-recommends $apt_opts \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev liblzma-dev libstdc++-12-dev

      - name: Bake Pistisai brand
        run: bash tool/brand.sh pistisai

      # The committed tree must already be the pistisai bake (#861): if the
      # bake changes web/ or lib/ (privacy page, generated l10n), the
      # template and the committed output have drifted.
      - name: Check brand bake drift
        run: git diff --exit-code --stat -- web lib

      - name: "🧪 flutter test (security + basic)"
        run: bash scripts/ci/flutter_security_basic_tests.sh

  build_web:
    name: "🌐 Build Web"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, flutter_analyze, flutter_smoke_test]
    if: needs.changes.outputs.flutter == 'true' && needs.flutter_analyze.result == 'success' && needs.flutter_smoke_test.result == 'success'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - name: "📦 flutter pub get"
        run: flutter pub get

      # The linux_native_deps build hook installs these itself when they are
      # missing: silently, inside the first `dart run`, with no retry. On a slow
      # mirror that used most of this job's time budget and the job was
      # cancelled in "Bake". Installing them here makes the time visible and
      # lets apt retry; the hook then finds them and skips its own install.
      - name: "📦 Native build deps (for build hooks)"
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get update -qq $apt_opts
          sudo apt-get install -y -qq --no-install-recommends $apt_opts \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev liblzma-dev libstdc++-12-dev

      - name: Bake Pistisai brand
        run: bash tool/brand.sh pistisai

      - name: "🌐 flutter build web"
        run: flutter build web --release --no-web-resources-cdn --dart-define=BRAND=pistisai

      - name: "📦 Upload web build"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  whitelabel_leak_check:
    name: "🏷️ White-label build has no upstream hosts"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, flutter_analyze, flutter_smoke_test]
    if: needs.changes.outputs.flutter == 'true' && needs.flutter_analyze.result == 'success' && needs.flutter_smoke_test.result == 'success'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - name: "📦 flutter pub get"
        run: flutter pub get

      # The linux_native_deps build hook installs these itself when they are
      # missing: silently, inside the first `dart run`, with no retry. On a slow
      # mirror that used most of this job's time budget and the job was
      # cancelled in "Bake". Installing them here makes the time visible and
      # lets apt retry; the hook then finds them and skips its own install.
      - name: "📦 Native build deps (for build hooks)"
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get update -qq $apt_opts
          sudo apt-get install -y -qq --no-install-recommends $apt_opts \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev liblzma-dev libstdc++-12-dev

      - name: Bake the example brand
        run: bash tool/brand.sh example

      - name: "🌐 flutter build web (example brand)"
        run: flutter build web --release --no-web-resources-cdn --dart-define=BRAND=example

      - name: "🏷️ No upstream hosts, links, schemes, or names"
        run: bash tool/brand_leak_check.sh build/web

  build_linux:
    name: "🐧 Build Linux Desktop"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, flutter_analyze, flutter_smoke_test]
    if: needs.changes.outputs.flutter == 'true' && needs.flutter_analyze.result == 'success' && needs.flutter_smoke_test.result == 'success'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - name: "🐧 Install Linux deps"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev \
            libnotify-dev libcurl4-openssl-dev \
            libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: Bake Pistisai brand
        run: bash tool/brand.sh pistisai

      - name: "🐧 flutter build linux --release"
        run: flutter build linux --release --dart-define=BRAND=pistisai

      - name: "📦 Package bundle"
        run: |
          cd build/linux/x64/release
          tar -czf /tmp/pistisai-linux-x64.tar.gz bundle/

      - name: "📦 Upload Linux build"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: linux-build
          path: /tmp/pistisai-linux-x64.tar.gz
          retention-days: 7

  backend:
    name: "Backend — lint & security"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, actionlint]
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: services/api-backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version-file: .nvmrc

      - name: "📦 Cache api-backend node_modules"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: services/api-backend/node_modules
          key: ${{ runner.os }}-api-backend-node-modules-${{ hashFiles('services/api-backend/package-lock.json') }}

      - name: "📦 npm ci"
        run: npm ci

      - name: "🔍 npm lint"
        run: npm run lint

      - name: "🔒 Forbid hardcoded auth bypass literal (#241)"
        working-directory: .
        run: bash scripts/tests/test_no_hardcoded_dev_bypass_token.sh

      - name: "Dokploy deploy trigger"
        working-directory: .
        run: bash scripts/tests/test_dokploy_deploy_trigger.sh

      - name: "Wait for the served version"
        working-directory: .
        run: bash scripts/tests/test_wait_for_served_version.sh

      - name: "🔒 npm run test:ci:security"
        run: npm run test:ci:security

  actionlint:
    name: "🔎 actionlint"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.7
          archive="actionlint_${version}_linux_amd64.tar.gz"
          checksum="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${checksum}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint workflows
        # Pin shellcheck off. actionlint runs it automatically when the
        # runner image provides the binary, and that turns pre-existing
        # info-level findings into a red gate. Workflow semantics are the check.
        run: actionlint -color -shellcheck=

  # GitHub reports this job name, not the workflow name. A ruleset that
  # requires checks must use this exact name. Skipped suites are allowed
  # only when the path filter says they do not apply.
  ci_gate:
    name: "🧪 CI — Test & Build Every Branch"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - actionlint
      - flutter_analyze
      - flutter_smoke_test
      - build_web
      - whitelabel_leak_check
      - build_linux
      - backend
    if: always()
    steps:
      - name: "Require every needed job to succeed or skip"
        env:
          CHANGES: ${{ needs.changes.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          ANALYZE: ${{ needs.flutter_analyze.result }}
          SMOKE: ${{ needs.flutter_smoke_test.result }}
          WEB: ${{ needs.build_web.result }}
          WHITELABEL: ${{ needs.whitelabel_leak_check.result }}
          LINUX: ${{ needs.build_linux.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          fail=0
          for result in "$CHANGES" "$ACTIONLINT" "$ANALYZE" "$SMOKE" "$WEB" "$WHITELABEL" "$LINUX" "$BACKEND"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Needed job ended with: $result"
                fail=1
                ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "CHANGES=$CHANGES ACTIONLINT=$ACTIONLINT ANALYZE=$ANALYZE SMOKE=$SMOKE WEB=$WEB WHITELABEL=$WHITELABEL LINUX=$LINUX BACKEND=$BACKEND"
            exit 1
          fi
          echo "All needed jobs succeeded or were skipped."
