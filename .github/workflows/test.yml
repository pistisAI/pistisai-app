name: "🧪 CI — Test & Build Every Branch"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"

concurrency:
  group: ci-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  flutter_analyze:
    name: "🔍 Flutter Analyze"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🔍 flutter analyze"
        run: flutter analyze lib/

  flutter_smoke_test:
    name: "🧪 Flutter — smoke"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🧪 flutter test (security + basic)"
        run: bash scripts/ci/flutter_security_basic_tests.sh

  build_web:
    name: "🌐 Build Web"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [flutter_analyze, flutter_smoke_test]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🌐 flutter build web"
        run: flutter build web --release --no-web-resources-cdn

      - name: "📦 Upload web build"
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  build_linux:
    name: "🐧 Build Linux Desktop"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [flutter_analyze, flutter_smoke_test]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: "🐧 Install Linux deps"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev \
            libnotify-dev libcurl4-openssl-dev \
            libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🐧 flutter build linux --release"
        run: flutter build linux --release

      - name: "📦 Package bundle"
        run: |
          cd build/linux/x64/release
          tar -czf /tmp/pistisai-linux-x64.tar.gz bundle/

      - name: "📦 Upload Linux build"
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: /tmp/pistisai-linux-x64.tar.gz
          retention-days: 7

  backend_lint:
    name: "Backend — lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "📦 npm install"
        run: npm install

      - name: "🔍 npm lint"
        run: npm run lint

  backend_security_test:
    name: "Backend — security tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "📦 npm install"
        run: npm install

      - name: "🔒 npm run test:ci:security"
        run: npm run test:ci:security
