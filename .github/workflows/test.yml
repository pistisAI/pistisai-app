name: "🧪 CI — Test & Build Every Branch"

# The one code-test workflow. Runs on GitHub-hosted runners only.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flutter_analyze:
    name: "🔍 Flutter Analyze"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true
      - name: "📦 flutter pub get"
        run: flutter pub get
      - name: "🔍 flutter analyze"
        run: flutter analyze lib/

  flutter_tests:
    name: "🧪 Flutter tests (security + basic gate)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true
      - name: "📦 flutter pub get"
        run: flutter pub get
      - name: Bake Pistisai brand
        run: bash tool/brand.sh pistisai
      - name: "🧪 flutter test (security + basic)"
        run: bash scripts/ci/flutter_security_basic_tests.sh

  backend:
    name: "Backend — lint & security"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: services/api-backend/package-lock.json
      - name: "📦 npm ci"
        run: npm ci --ignore-scripts
      - name: "🔒 npm run test:ci:security"
        run: npm run test:ci:security

  # Branch protection requires this exact check name. Keep it so existing
  # required-check settings keep resolving to this workflow.
  ci_gate:
    name: "🧪 CI — Test & Build Every Branch"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - flutter_analyze
      - flutter_tests
      - backend
    if: always()
    steps:
      - name: "Require every needed job to succeed"
        env:
          ANALYZE: ${{ needs.flutter_analyze.result }}
          TESTS: ${{ needs.flutter_tests.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          fail=0
          for result in "$ANALYZE" "$TESTS" "$BACKEND"; do
            [ "$result" = "success" ] || { echo "Needed job ended with: $result"; fail=1; }
          done
          exit "$fail"
