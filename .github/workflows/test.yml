name: "🧪 CI — Test & Build Every Branch"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"

concurrency:
  group: ci-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  changes:
    name: "🔎 Detect changes"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      flutter: ${{ steps.gate.outputs.flutter }}
      backend: ${{ steps.gate.outputs.backend }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Push to main diffs github.event.before..HEAD. A depth-1 clone
          # does not contain that parent, and GitHub will not fetch it by SHA.
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        continue-on-error: true
        with:
          # Empty token uses git diff (contents: read). Push compares
          # github.event.before..HEAD. Pull requests compare the PR base SHA.
          token: ""
          filters: |
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'web/**'
              - 'linux/**'
              - 'windows/**'
              - 'macos/**'
              - 'assets/**'
              - 'analysis_options.yaml'
              - '.github/workflows/test.yml'
            backend:
              - 'services/api-backend/**'
              - 'test/api-backend/**'
              - 'scripts/tests/**'
              - '.github/workflows/test.yml'

      - name: "Fail open if the path filter failed"
        id: gate
        if: always() && (steps.filter.outcome == 'success' || steps.filter.outcome == 'failure')
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FLUTTER: ${{ steps.filter.outputs.flutter }}
          BACKEND: ${{ steps.filter.outputs.backend }}
        run: |
          if [ "$FILTER_OUTCOME" = "success" ]; then
            echo "flutter=$FLUTTER" >> "$GITHUB_OUTPUT"
            echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

  flutter_analyze:
    name: "🔍 Flutter Analyze"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.flutter == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🔍 flutter analyze"
        run: flutter analyze lib/

  flutter_smoke_test:
    name: "🧪 Flutter — smoke"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.flutter == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🧪 flutter test (security + basic)"
        run: bash scripts/ci/flutter_security_basic_tests.sh

  build_web:
    name: "🌐 Build Web"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, flutter_analyze, flutter_smoke_test]
    if: needs.changes.outputs.flutter == 'true' && needs.flutter_analyze.result == 'success' && needs.flutter_smoke_test.result == 'success'

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🌐 flutter build web"
        run: flutter build web --release --no-web-resources-cdn

      - name: "📦 Upload web build"
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  build_linux:
    name: "🐧 Build Linux Desktop"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, flutter_analyze, flutter_smoke_test]
    if: needs.changes.outputs.flutter == 'true' && needs.flutter_analyze.result == 'success' && needs.flutter_smoke_test.result == 'success'

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true

      - name: "🐧 Install Linux deps"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev \
            libnotify-dev libcurl4-openssl-dev \
            libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🐧 flutter build linux --release"
        run: flutter build linux --release

      - name: "📦 Package bundle"
        run: |
          cd build/linux/x64/release
          tar -czf /tmp/pistisai-linux-x64.tar.gz bundle/

      - name: "📦 Upload Linux build"
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: /tmp/pistisai-linux-x64.tar.gz
          retention-days: 7

  backend:
    name: "Backend — lint & security"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: services/api-backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: "📦 Cache api-backend node_modules"
        uses: actions/cache@v6
        with:
          path: services/api-backend/node_modules
          key: ${{ runner.os }}-api-backend-node-modules-${{ hashFiles('services/api-backend/package.json') }}

      - name: "📦 npm install"
        run: npm install

      - name: "🔍 npm lint"
        run: npm run lint

      - name: "🔒 Forbid hardcoded auth bypass literal (#241)"
        working-directory: .
        run: bash scripts/tests/test_no_hardcoded_dev_bypass_token.sh

      - name: "🔒 npm run test:ci:security"
        run: npm run test:ci:security
