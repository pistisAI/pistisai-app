name: "⚡ CI Quick Gate"

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
          cache: true
      - name: flutter pub get
        run: |
          set -euo pipefail
          flutter pub get
      - name: flutter analyze
        run: |
          set -euo pipefail
          flutter analyze lib/
          echo "✅ Analysis passed"
