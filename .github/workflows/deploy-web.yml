name: "🌐 Web Deploy"

on:
  workflow_run:
    workflows: ["🔢 Auto Version Bump"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pistisai/pistisai-app-web

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
      - name: flutter analyze
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

  build_and_push:
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' assets/version.json)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify image pushed
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "❌ No image digest returned — push may have failed"
            exit 1
          fi
          echo "✅ Image pushed: $DIGEST"

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "⚠️ VPS secrets not set — skipping SSH deploy"
            exit 0
          fi

          # Write SSH key
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key

          # Build image locally and save as tarball
          echo "📦 Saving Docker image as tarball..."
          docker build -f Dockerfile.web -t pistisai-app-web:${{ steps.version.outputs.tag }} .
          docker save pistisai-app-web:${{ steps.version.outputs.tag }} -o /tmp/pistisai-app-web.tar

          # Copy tarball to VPS
          echo "📤 Copying image to VPS..."
          scp -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=no /tmp/pistisai-app-web.tar ${VPS_USER}@${VPS_HOST}:${VPS_DEPLOY_PATH}/pistisai-app-web.tar

          # Deploy on VPS
          echo "🚀 Deploying on VPS..."
          ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} "cd ${VPS_DEPLOY_PATH} && docker load -i pistisai-app-web.tar && (docker stop pistisai-app-web 2>/dev/null || true) && (docker rm pistisai-app-web 2>/dev/null || true) && docker run -d --name pistisai-app-web --restart unless-stopped --network dokploy-network -p 8080:80 pistisai-app-web:latest && rm -f pistisai-app-web.tar && echo '✅ Deployment complete'"

      - name: Purge Cloudflare cache
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then
            echo "⚠️ CLOUDFLARE_CACHE_PURGE_TOKEN not set — skipping cache purge"
            exit 0
          fi
          if [ -z "${CF_ZONE_ID:-}" ]; then
            echo "⚠️ CF_ZONE_ID not set — skipping cache purge"
            exit 0
          fi
          echo "🧹 Purging Cloudflare cache for zone $CF_ZONE_ID..."
          PURGE_RESP=$(curl -sS --max-time 30 -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' 2>&1)
          SUCCESS=$(echo "$PURGE_RESP" | jq -r '.success // false')
          if [ "$SUCCESS" = "true" ]; then
            echo "✅ Cloudflare cache purged"
          else
            echo "⚠️ Cache purge response: $PURGE_RESP"
          fi
