name: "🌐 Web Deploy"

on:
  workflow_run:
    workflows: ["🔢 Auto Version Bump"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pistisai/pistisai-app-web

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
      - name: flutter analyze
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

  build_and_push:
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' assets/version.json)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify image pushed
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "❌ No image digest returned — push may have failed"
            exit 1
          fi
          echo "✅ Image pushed: $DIGEST"

      - name: Make image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Make the container package public so Dokpull can pull without auth
          PACKAGE_PATH="${{ github.repository }}/pistisai-app-web"
          echo "🔓 Making package public: $PACKAGE_PATH"
          # Get the package ID first
          PKG_INFO=$(gh api "repos/${{ github.repository }}/packages/container/pistisai-app-web" \
            -H "Accept: application/vnd.github+json" 2>&1) || true
          echo "$PKG_INFO" | jq -r '.id // empty' > /dev/null 2>&1 || true
          # Update visibility to public
          RESP=$(gh api -X PATCH "repos/${{ github.repository }}/packages/container/pistisai-app-web" \
            -f visibility=public \
            -H "Accept: application/vnd.github+json" 2>&1) || true
          if echo "$RESP" | jq -e '.visibility == "public"' > /dev/null 2>&1; then
            echo "✅ Package is now public"
          else
            echo "⚠️ Could not set package public (may already be public or org policy blocks it)"
            echo "$RESP" | head -5 || true
          fi

      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_WEBHOOK_URL:-}" ]; then
            echo "⚠️ DOKPLOY_WEBHOOK_URL not set — skipping deploy trigger"
            exit 0
          fi
          echo "🚀 Triggering Dokploy deploy..."
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -sS --fail --max-time 30 -o /tmp/dokploy_response.txt -w "%{http_code}" -X POST "$DOKPLOY_WEBHOOK_URL" 2>&1) || true
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
              echo "✅ Dokploy deploy triggered (HTTP $HTTP_CODE)"
              break
            fi
            echo "⚠️ Attempt $attempt: HTTP $HTTP_CODE"
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            else
              echo "❌ Dokploy webhook failed after 3 attempts"
              cat /tmp/dokploy_response.txt || true
              exit 1
            fi
          done

      - name: Purge Cloudflare cache
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then
            echo "⚠️ CLOUDFLARE_CACHE_PURGE_TOKEN not set — skipping cache purge"
            exit 0
          fi
          if [ -z "${CF_ZONE_ID:-}" ]; then
            echo "⚠️ CF_ZONE_ID not set — skipping cache purge"
            exit 0
          fi
          echo "🧹 Purging Cloudflare cache for zone $CF_ZONE_ID..."
          PURGE_RESP=$(curl -sS --max-time 30 -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' 2>&1)
          SUCCESS=$(echo "$PURGE_RESP" | jq -r '.success // false')
          if [ "$SUCCESS" = "true" ]; then
            echo "✅ Cloudflare cache purged"
          else
            echo "⚠️ Cache purge response: $PURGE_RESP"
          fi
