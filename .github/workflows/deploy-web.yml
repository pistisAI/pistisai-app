name: "🌐 Web Deploy"

on:
  push:
    branches:
      - main
      - "antigravity/**"
      - "codex/**"
    paths:
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "config/nginx/**"
      - "config/docker/Dockerfile.web"
      - "scripts/packaging/stage_web_installers.sh"
      - "scripts/packaging/installer-template.ps1"
      - "scripts/packaging/build_installer.sh"
      - "scripts/packaging/installer-template.sh"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
      - name: flutter analyze
        run: |
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

      - name: flutter test (CI smoke)
        continue-on-error: false
        run: |
          bash scripts/ci/flutter_security_basic_tests.sh
          echo "✅ Smoke tests passed"

  build_and_deploy:
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons --no-web-resources-cdn

      - name: Stage web installer scripts
        run: |
          chmod +x scripts/packaging/stage_web_installers.sh
          ./scripts/packaging/stage_web_installers.sh
          head -3 build/web/install.sh
          test -f build/web/install.sh
          test -f build/web/install.ps1
          test "$(head -c 2 build/web/install.sh)" = "#!"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web/
          retention-days: 1

      - name: Trigger VPS deploy via webhook
        if: github.ref_name == 'main'
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || 'https://deploy.pistisai.app/deploy' }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET || 'pistisai-deploy-secret' }}
        run: |
          set -euo pipefail
          PAYLOAD="{\"ref\":\"$GITHUB_SHA\",\"repository\":\"$GITHUB_REPOSITORY\",\"workflow\":\"$GITHUB_WORKFLOW\"}"
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | awk '{print $2}')
          echo "🚀 Triggering deploy webhook..."
          HTTP_CODE=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD" 2>&1) || true
          echo "Webhook HTTP status: $HTTP_CODE"
          cat /tmp/deploy_response.txt 2>/dev/null || true
          if [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Deploy webhook triggered successfully"
          else
            echo "⚠️ Webhook returned HTTP $HTTP_CODE (artifact still uploaded; deploy may be delayed)"
          fi


      - name: Purge Cloudflare cache
        if: always()
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID || '8261c24001b81e3513d82aef76fef90f' }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_CACHE_PURGE_TOKEN:-}" ]; then
            echo "Missing Cloudflare cache purge token, skipping cache purge"
            exit 0
          fi
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Cache purge' if d.get('success') else f\"❌ {d.get('errors')}\")" \
            || echo "Cloudflare cache purge failed (ignored)"

      - name: Sync Cloudflare install script redirects
        if: always()
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID || '8261c24001b81e3513d82aef76fef90f' }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_CACHE_PURGE_TOKEN:-}" ]; then
            echo "Missing Cloudflare cache purge token, skipping redirect sync"
            exit 0
          fi
          INSTALL_SH_URL="https://github.com/pistisAI/pistisai-app/releases/latest/download/install.sh"
          python3 - <<'PY' "$CF_ZONE_ID" "$CLOUDFLARE_CACHE_PURGE_TOKEN" "$INSTALL_SH_URL"
          import json, sys, urllib.request
          zone_id, api_token, install_sh = sys.argv[1:4]
          api = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/phases/http_request_dynamic_redirect/entrypoint"
          headers = {"Authorization": f"Bearer {api_token}", "Content-Type": "application/json"}

          def cf(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          def redirect_rule(name, expression, target):
              return {
                  "action": "redirect",
                  "expression": expression,
                  "description": name,
                  "action_parameters": {
                      "from_value": {
                          "target_url": {"value": target},
                          "status_code": {"value": 302},
                          "preserve_query_string": {"value": True},
                      }
                  },
                  "enabled": True,
              }

          host_expr = '(http.host eq "pistisai.app" or http.host eq "www.pistisai.app" or http.host eq "app.pistisai.app")'
          rules = [
              redirect_rule(
                  "Pistisai install.sh",
                  f'{host_expr} and http.request.uri.path eq "/install.sh"',
                  install_sh,
              ),
          ]
          payload = {"rules": rules}
          try:
              existing = cf("GET", api)
              ruleset_id = existing.get("result", {}).get("id")
              if ruleset_id:
                  cf("PUT", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/{ruleset_id}", payload)
              else:
                  cf("PUT", api, payload)
              print("Cloudflare install.sh redirect synced")
          except Exception as exc:
              print(f"Cloudflare redirect sync skipped: {exc}")
          PY