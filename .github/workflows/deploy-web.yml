name: "🌐 Web Deploy"

# Entry point for the release/deploy chain (#681): push to main starts Web
# Deploy; desktop, mobile, and backend listen to this workflow via workflow_run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # write is required to export the Buildx cache with type=gha
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pistisai/pistisai-app-web

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse a non-main ref
        if: github.ref_name != 'main'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Web deploy publishes :latest and purges the production zone. Refusing ref ${REF_NAME}."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Pin the main commit that triggered this run. A moving main tip
          # can publish a different tree while the job is queued.
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true
      - name: flutter analyze
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

  build_and_push:
    needs: [analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
      served_version: ${{ steps.version.outputs.served_version }}
    steps:
      - name: Refuse a non-main ref
        if: github.ref_name != 'main'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Web deploy publishes :latest and purges the production zone. Refusing ref ${REF_NAME}."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' assets/version.json)
          BUILD=$(jq -r '.build_number' assets/version.json)
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          # Dockerfile.web writes this into index.html as flutter_bootstrap.js?v=
          echo "served_version=${VERSION}.${BUILD}" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify image pushed
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "❌ No image digest returned — push may have failed"
            exit 1
          fi
          echo "✅ Image pushed: $DIGEST"

  # Dokploy pulls the published image and starts it. Nothing is purged until
  # that trigger has been accepted and the public site serves this version.
  deploy_dokploy:
    needs: [build_and_push]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/ci
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_TARGET_LABEL: web
          DOKPLOY_IMAGE_TAG: latest
          DOKPLOY_IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOKPLOY_REQUIRED: ${{ vars.DOKPLOY_REQUIRED }}
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_WEB_APPLICATION_ID }}
        run: bash scripts/ci/trigger_dokploy_deploy.sh

  # The purge runs only after deploy_dokploy. It still fails when the
  # Cloudflare token or zone id is missing, when the host does not serve this
  # version before the timeout, or when Cloudflare does not return success.
  purge_cache:
    needs: [build_and_push, deploy_dokploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - name: Require Cloudflare purge credentials
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "❌ CLOUDFLARE_CACHE_PURGE_TOKEN and CF_ZONE_ID must both be set"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/ci
      - name: Wait until the host serves this version
        env:
          SERVED_VERSION_URL: ${{ vars.WEB_SERVED_VERSION_URL }}
          SERVED_VERSION: "flutter_bootstrap.js?v=${{ needs.build_and_push.outputs.served_version }}"
          SERVED_VERSION_MODE: text
        run: bash scripts/ci/wait_for_served_version.sh
      # Every deploy purges the whole zone, and the deploy fails if it cannot.
      - name: Purge Cloudflare cache (full zone)
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "❌ CLOUDFLARE_CACHE_PURGE_TOKEN and CF_ZONE_ID must both be set"
            exit 1
          fi
          RESP=$(curl -sS --max-time 30 -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if [ "$(echo "$RESP" | jq -r '.success // false')" != "true" ]; then
            echo "❌ Cloudflare purge failed: $(echo "$RESP" | jq -c '.errors // "no error detail"')"
            exit 1
          fi
          echo "✅ Cloudflare cache purged (full zone)"
