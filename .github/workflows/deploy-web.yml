name: "🌐 Web Deploy"

# The only way the web app reaches the VPS. Manual deploys are prohibited.
# Builds Dockerfile.web, ships the image over a restricted SSH key whose
# forced command (deploy/vps/gha-web-deploy.sh) can only load and swap this
# repo's web container, purges the Cloudflare zone, then checks the live site.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP: ${{ github.repository == 'iacle-solutions/iacle-app' && 'iacle' || 'pistisai' }}
      DOMAIN: ${{ github.repository == 'iacle-solutions/iacle-app' && 'iacle.app' || 'pistisai.app' }}
      TITLE: ${{ github.repository == 'iacle-solutions/iacle-app' && 'IACl' || 'Pistisai' }}
    steps:
      - uses: actions/checkout@v7

      - name: Require deploy secrets
        env:
          SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WEB_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.WEB_DEPLOY_HOST }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          missing=0
          for v in SSH_KEY KNOWN_HOSTS HOST CF_TOKEN CF_ZONE_ID; do
            if [ -z "${!v:-}" ]; then echo "::error::deploy secret for $v is not set"; missing=1; fi
          done
          exit "$missing"

      - name: Set image tag
        run: echo "IMAGE=${APP}-web:gha-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: BRAND=${{ env.APP }}
          secrets: |
            brand_licence=${{ secrets.IACLE_BRAND_LICENCE }}

      - name: Check the image before shipping it
        run: |
          set -euo pipefail
          docker run -d --name web-check -p 127.0.0.1:18080:80 "$IMAGE"
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:18080/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/ -o index.html
          grep -q "<title>${TITLE}" index.html || { echo "::error::wrong brand title"; grep -o '<title>[^<]*' index.html; exit 1; }
          V=$(grep -oE 'flutter_bootstrap\.js\?v=[0-9a-f]{12}' index.html | cut -d= -f2)
          [ -n "$V" ] || { echo "::error::index.html is not cache-busted"; exit 1; }
          curl -fsS http://127.0.0.1:18080/flutter_bootstrap.js | grep -q "\"mainJsPath\":\"main.dart.js?v=${V}\"" \
            || { echo "::error::flutter_bootstrap.js does not load main.dart.js?v=${V}"; exit 1; }
          for f in / flutter_bootstrap.js main.dart.js flutter_service_worker.js; do
            cc=$(curl -fsSI "http://127.0.0.1:18080/$f" | tr -d '\r' | grep -i '^cache-control:' || true)
            echo "/$f -> $cc"
            echo "$cc" | grep -qi 'immutable' && { echo "::error::/$f is served immutable"; exit 1; }
            echo "$cc" | grep -qi 'no-cache' || { echo "::error::/$f is not no-cache"; exit 1; }
          done
          echo "BUILD_V=$V" >> "$GITHUB_ENV"
          docker rm -f web-check

      - name: Deploy to the VPS
        env:
          SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WEB_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.WEB_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/web_deploy && chmod 600 ~/.ssh/web_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          docker save "$IMAGE" | ssh -i ~/.ssh/web_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ConnectTimeout=30 "ghdeploy@${HOST}" "$GITHUB_SHA"
          rm -f ~/.ssh/web_deploy

      - name: Purge Cloudflare cache (mandatory)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          resp=$(curl -sS --max-time 30 -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if [ "$(echo "$resp" | jq -r '.success // false')" != "true" ]; then
            echo "::error::Cloudflare purge failed: $(echo "$resp" | jq -c '.errors')"
            exit 1
          fi
          echo "Cloudflare cache purged"

      - name: Confirm the live site serves this build
        run: |
          set -euo pipefail
          for host in "$DOMAIN" "www.$DOMAIN"; do
            ok=0
            for _ in $(seq 1 24); do
              if curl -fsS --max-time 30 "https://${host}/?gha=${GITHUB_RUN_ID}" -o page.html \
                && grep -q "<title>${TITLE}" page.html \
                && grep -q "flutter_bootstrap.js?v=${BUILD_V}" page.html; then
                ok=1; break
              fi
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::https://${host}/ does not serve build ${BUILD_V}"; exit 1; }
            curl -fsS "https://${host}/main.dart.js?v=${BUILD_V}" -o main.js
            echo "${host}: build ${BUILD_V}, main.dart.js $(sha256sum main.js | cut -c1-12)"
            [ "$(sha256sum main.js | cut -c1-12)" = "$BUILD_V" ] || { echo "::error::${host} serves a different main.dart.js"; exit 1; }
          done
