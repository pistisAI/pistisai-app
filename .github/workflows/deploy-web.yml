name: "🌐 Web Deploy"

on:
  push:
    branches:
      - main
      - "antigravity/**"
      - "codex/**"
    paths:
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "config/nginx/**"
      - "config/docker/Dockerfile.web"
      - "scripts/packaging/stage_web_installers.sh"
      - "scripts/packaging/installer-template.ps1"
      - "scripts/packaging/build_installer.sh"
      - "scripts/packaging/installer-template.sh"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"
      - name: flutter analyze
        run: |
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

      - name: flutter test (CI smoke)
        continue-on-error: false
        run: |
          bash scripts/ci/flutter_security_basic_tests.sh
          echo "✅ Smoke tests passed"

  build_and_deploy:
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: "stable"

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons --no-web-resources-cdn

      - name: Stage web installer scripts
        run: |
          chmod +x scripts/packaging/stage_web_installers.sh
          ./scripts/packaging/stage_web_installers.sh
          head -3 build/web/install.sh
          test -f build/web/install.sh
          test -f build/web/install.ps1
          test "$(head -c 2 build/web/install.sh)" = "#!"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web/
          retention-days: 1

      - name: Deploy to VPS
        if: github.ref_name == 'main'
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || 'pistisai.app' }}
          VPS_USER: ${{ secrets.VPS_USER || 'cloudllm' }}
          PISTISAI_VPS_SSH_HOST: ${{ secrets.PISTISAI_VPS_SSH_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${VM_SSH_PRIVATE_KEY:-}" ]; then
            echo "No SSH key available, skipping VPS deploy"
            exit 0
          fi
          if [ "${VPS_HOST}" = "31.97.140.7" ]; then
            echo "Ignoring Simon VPS host 31.97.140.7 — deploying to pistisai.app"
            VPS_HOST="pistisai.app"
            VPS_USER="cloudllm"
          fi
          if [ "${PISTISAI_VPS_SSH_HOST:-}" = "31.97.140.7" ]; then
            echo "Ignoring Simon origin SSH host 31.97.140.7"
            PISTISAI_VPS_SSH_HOST=""
          fi
          if [ "${VPS_USER}" = "pistisai" ]; then
            echo "Ignoring Simon SSH user pistisai — using cloudllm"
            VPS_USER="cloudllm"
          fi

          case "${PISTISAI_VPS_SSH_HOST:-}" in
            ''|pistisai.app|www.pistisai.app|app.pistisai.app|api.pistisai.app|hermes.pistisai.app)
              echo "PISTISAI_VPS_SSH_HOST is unset or Cloudflare-proxied; skipping live VPS deploy."
              echo "GitHub runners cannot SSH to pistisai.app:22 (Cloudflare anycast). Set PISTISAI_VPS_SSH_HOST to the origin VPS IP, never 31.97.140.7."
              echo "Web build artifact was uploaded; live VPS publish is skipped."
              exit 0
              ;;
          esac

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host pistisai-vps
            HostName ${PISTISAI_VPS_SSH_HOST}
            User ${VPS_USER}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

          tar -czf /tmp/web_build.tar.gz -C build/web .
          echo "Upload size: $(wc -c < /tmp/web_build.tar.gz) bytes"
          scp /tmp/web_build.tar.gz pistisai-vps:/tmp/web_build.tar.gz

          ssh pistisai-vps "sudo mkdir -p /opt/Pistisai/build/web && sudo rm -rf /opt/Pistisai/build/web/* && sudo tar -xzf /tmp/web_build.tar.gz -C /opt/Pistisai/build/web/ && sudo rm /tmp/web_build.tar.gz && cd /opt/Pistisai && (sudo docker compose -f docker-compose.multi.yml --env-file .env up -d --no-deps flutter-app || sudo docker compose -f docker-compose.multi.yml --env-file .env up -d --build --no-deps flutter-app)"

          sleep 5
          for i in {1..20}; do
            if curl -sf "https://app.pistisai.app/health" > /dev/null 2>&1 || curl -sf "https://pistisai.app/health" > /dev/null 2>&1; then
              echo "✅ Pistisai web service healthy"
              exit 0
            fi
            echo "Waiting for health check to propagate... attempt $i/20"
            sleep 3
          done
          echo "❌ Pistisai web service health check failed"
          exit 1


      - name: Purge Cloudflare cache
        if: always()
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ] || [ -z "${CLOUDFLARE_CACHE_PURGE_TOKEN:-}" ]; then
            echo "Missing Cloudflare secrets, skipping cache purge"
            exit 0
          fi
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            || echo "Cloudflare cache purge failed"
          echo "Cloudflare cache purged"

      - name: Sync Cloudflare install script redirects
        if: always()
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ] || [ -z "${CLOUDFLARE_CACHE_PURGE_TOKEN:-}" ]; then
            echo "Missing Cloudflare secrets, skipping install redirect sync"
            exit 0
          fi
          INSTALL_SH_URL="https://github.com/pistisAI/pistisai-app/releases/latest/download/install.sh"
          python3 - <<'PY' "$CLOUDFLARE_ZONE_ID" "$CLOUDFLARE_CACHE_PURGE_TOKEN" "$INSTALL_SH_URL"
          import json, sys, urllib.request

          zone_id, token, install_sh = sys.argv[1:4]
          api = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/phases/http_request_dynamic_redirect/entrypoint"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def cf(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          def redirect_rule(name, expression, target):
              return {
                  "action": "redirect",
                  "expression": expression,
                  "description": name,
                  "action_parameters": {
                      "from_value": {
                          "target_url": {"value": target},
                          "status_code": {"value": 302},
                          "preserve_query_string": {"value": True},
                      }
                  },
                  "enabled": True,
              }

          host_expr = '(http.host eq "pistisai.app" or http.host eq "www.pistisai.app" or http.host eq "app.pistisai.app")'
          rules = [
              redirect_rule(
                  "Pistisai install.sh",
                  f'{host_expr} and http.request.uri.path eq "/install.sh"',
                  install_sh,
              ),
          ]
          payload = {"rules": rules}
          try:
              existing = cf("GET", api)
              ruleset_id = existing.get("result", {}).get("id")
              if ruleset_id:
                  cf("PUT", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/{ruleset_id}", payload)
              else:
                  cf("PUT", api, payload)
              print("Cloudflare install.sh redirect synced")
          except Exception as exc:
              print(f"Cloudflare redirect sync skipped: {exc}")
          PY