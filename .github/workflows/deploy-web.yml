name: "🌐 Web Deploy"

on:
  workflow_run:
    workflows: ["🔢 Auto Version Bump"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # write is required to export the Buildx cache with type=gha
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pistisai/pistisai-app-web

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true
      - name: flutter analyze
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

  build_and_push:
    needs: [analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' assets/version.json)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify image pushed
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "❌ No image digest returned — push may have failed"
            exit 1
          fi
          echo "✅ Image pushed: $DIGEST"

  # Known gap: the host still pulls the image by hand (`docker compose up -d`),
  # so this purge can run before the host serves the new image. Moving the pull
  # into Actions closes it; until then, re-run this workflow if the host deploys late.
  purge_cache:
    needs: [build_and_push]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      # Every deploy purges the whole zone, and the deploy fails if it cannot.
      - name: Purge Cloudflare cache (full zone)
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "❌ CLOUDFLARE_CACHE_PURGE_TOKEN and CF_ZONE_ID must both be set"
            exit 1
          fi
          RESP=$(curl -sS --max-time 30 -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if [ "$(echo "$RESP" | jq -r '.success // false')" != "true" ]; then
            echo "❌ Cloudflare purge failed: $(echo "$RESP" | jq -c '.errors // "no error detail"')"
            exit 1
          fi
          echo "✅ Cloudflare cache purged (full zone)"
