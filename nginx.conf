server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    etag on;

    # Flutter web file names carry no content hash (main.dart.js,
    # flutter_bootstrap.js, assets/...). Every response must be revalidated
    # (ETag / Last-Modified, 304 when unchanged). A long "immutable" lifetime
    # pins returning visitors to an old build after a deploy.
    # Dockerfile.web also stamps main.dart.js and flutter_bootstrap.js with
    # ?v=<content hash> so browsers holding an old immutable copy fetch the
    # new build on a normal reload.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;
    gzip_min_length 256;
}
