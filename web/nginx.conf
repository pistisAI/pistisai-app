server {
  listen 8080;

  server_name _;

  location /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /install.sh {
    default_type text/x-shellscript;
    add_header Content-Type "text/x-shellscript; charset=utf-8" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /install.sh =404;
  }

  location = /install.ps1 {
    default_type text/plain;
    add_header Content-Type "text/plain; charset=utf-8" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /install.ps1 =404;
  }

  # Static, crawlable legal pages (served as real HTML, not the Flutter SPA shell)
  # so search engines and OAuth verifiers can read their content.
  location = /privacy {
    root /usr/share/nginx/html;
    default_type text/html;
    try_files /privacy.html =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}

